name: ci
on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: |
          pip install -r requirements.txt
          pip install mkdocs-minify-plugin>=0.2
      - run: |
          mkdocs gh-deploy --force
